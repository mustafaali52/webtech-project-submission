<div class="getmarks-container">
  <h2>Your Quiz Attempts</h2>

  <mat-progress-spinner *ngIf="loading" mode="indeterminate"></mat-progress-spinner>

  <div *ngIf="errorMessage" class="error-message">
    <mat-icon>error</mat-icon>
    {{ errorMessage }}
  </div>

  <table *ngIf="!loading && attempts.length > 0" mat-table [dataSource]="attempts" class="mat-elevation-z8">

    <!-- Quiz Title Column -->
    <ng-container matColumnDef="quizTitle">
      <th mat-header-cell *matHeaderCellDef>Quiz Title</th>
      <td mat-cell *matCellDef="let attempt">{{ attempt.quizTitle }}</td>
    </ng-container>

    <!-- Date Attempted Column -->
    <ng-container matColumnDef="dateAttempted">
      <th mat-header-cell *matHeaderCellDef>Date Attempted</th>
      <td mat-cell *matCellDef="let attempt">{{ attempt.dateAttempted | date:'medium' }}</td>
    </ng-container>

    <!-- Score Column -->
    <ng-container matColumnDef="score">
      <th mat-header-cell *matHeaderCellDef>Score</th>
      <td mat-cell *matCellDef="let attempt">{{ attempt.score }} / {{ attempt.totalQuestions }}</td>
    </ng-container>

    <!-- Percentage Column -->
    <ng-container matColumnDef="percentage">
      <th mat-header-cell *matHeaderCellDef>Percentage</th>
      <td mat-cell *matCellDef="let attempt">{{ attempt.percentage | number:'1.0-2' }}%</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['quizTitle', 'dateAttempted', 'score', 'percentage']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['quizTitle', 'dateAttempted', 'score', 'percentage'];"></tr>
  </table>

  <div *ngIf="!loading && attempts.length === 0" class="no-data-message">
    <mat-icon>info</mat-icon>
    No quiz attempts found.
  </div>
</div>
